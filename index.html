<!doctype html>
<html lang="ko" data-theme="horde">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>레이드 지휘실</title>
  <script>
    try {
      var t = localStorage.getItem("wow-raid-theme");
      document.documentElement.setAttribute("data-theme", t === "alliance" ? "alliance" : "horde");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "horde");
    }
  </script>
  <script>
    (function () {
      var base = document.createElement("base");
      base.href = location.protocol === "file:"
        ? location.href.split("#")[0].replace(/[^/]*$/, "")
        : "/";
      document.head.appendChild(base);
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app is-home">
    <header class="top">
      <button type="button" class="brand" id="brandHome">
        <span class="back-btn hidden" id="backHome" aria-hidden="true">←</span>
        <span class="crest" aria-hidden="true"></span>
        <span class="brand-copy">
          <span class="eyebrow">RAID COMMAND ROOM</span>
          <span class="title" data-i18n="homeTitle"></span>
          <span class="patch" id="patch"></span>
        </span>
      </button>
      <div class="top-utils">
        <div id="authBox" class="auth-box"></div>
        <div class="settings-wrap">
          <button type="button" class="settings-btn" id="settingsBtn" aria-expanded="false" aria-controls="settingsPanel" title="Settings">⚙</button>
          <div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-label="Settings">
            <div class="settings-label" data-i18n="settingsLabel"></div>
            <div class="settings-row">
              <span data-i18n="langLabel"></span>
              <button class="ghost" id="langBtn" type="button">EN</button>
            </div>
            <div class="settings-row">
              <span data-i18n="factionLabel"></span>
              <div class="faction-switch" role="group" aria-label="Faction theme">
                <button type="button" class="faction-btn" data-theme-set="horde" id="themeHorde">호드</button>
                <button type="button" class="faction-btn" data-theme-set="alliance" id="themeAlliance">얼라</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="homeView">
      <section class="hub">
        <div class="hub-board">
          <a class="hub-feature" href="/planner" data-view="planner">
            <span class="hub-shot">
              <img class="hub-art" src="assets/bosses/portraits/ulatek.png" alt="">
              <img class="hub-wash is-horde" src="assets/hub/planner-horde.jpg" alt="">
              <img class="hub-wash is-alliance" src="assets/hub/planner-alliance.png" alt="">
              <img class="hub-photo is-horde" src="assets/hub/planner-horde.jpg" alt="">
              <img class="hub-photo is-alliance" src="assets/hub/planner-alliance.png" alt="">
              <img class="hub-photo" src="assets/hub/planner.jpg" alt="" onerror="this.remove()">
              <video class="hub-video" muted loop playsinline preload="metadata"
                onloadeddata="this.classList.add('is-on');this.play()"
                onerror="this.remove()">
                <source src="assets/hub/stage.mp4" type="video/mp4">
              </video>
            </span>
            <span class="hub-copy">
              <strong data-i18n="plannerTab"></strong>
              <span class="hub-desc" data-i18n="plannerDesc"></span>
              <span class="hub-go" data-i18n="enter"></span>
            </span>
          </a>
          <div class="hub-rest">
            <a class="hub-item" href="/helper" data-view="helper">
              <span class="hub-shot">
                <img class="hub-art" src="assets/bosses/portraits/vashnik.png" alt="">
                <img class="hub-wash is-horde" src="assets/hub/helper-horde.jpg" alt="">
                <img class="hub-wash is-alliance" src="assets/hub/helper-alliance.jpg" alt="">
                <img class="hub-photo is-horde" src="assets/hub/helper-horde.jpg" alt="">
                <img class="hub-photo is-alliance" src="assets/hub/helper-alliance.jpg" alt="">
                <img class="hub-photo" src="assets/hub/helper.jpg" alt="" onerror="this.remove()">
              </span>
              <span class="hub-copy">
                <strong data-i18n="helperTab"></strong>
                <span class="hub-desc" data-i18n="helperDesc"></span>
                <span class="hub-go" data-i18n="enter"></span>
              </span>
            </a>
            <a class="hub-item is-soon" href="/game" data-view="game">
              <span class="hub-shot">
                <img class="hub-art" src="assets/bosses/portraits/sszorak.png" alt="">
                <img class="hub-wash is-horde" src="assets/hub/game-horde.jpg" alt="">
                <img class="hub-wash is-alliance" src="assets/hub/game-alliance.jpg" alt="">
                <img class="hub-photo is-horde" src="assets/hub/game-horde.jpg" alt="">
                <img class="hub-photo is-alliance" src="assets/hub/game-alliance.jpg" alt="">
                <img class="hub-photo" src="assets/hub/game.jpg" alt="" onerror="this.remove()">
              </span>
              <span class="hub-copy">
                <strong data-i18n="gameTab"></strong>
                <span class="hub-desc" data-i18n="gameDesc"></span>
                <span class="hub-go" data-i18n="gameSoonBadge"></span>
              </span>
            </a>
            <a class="hub-item is-soon" href="/plaza" data-view="plaza">
              <span class="hub-shot">
                <img class="hub-art" src="assets/bosses/portraits/lost-explorers.png" alt="">
                <img class="hub-wash is-horde" src="assets/hub/plaza-horde.jpg" alt="">
                <img class="hub-wash is-alliance" src="assets/hub/plaza-alliance.jpg" alt="">
                <img class="hub-photo is-horde" src="assets/hub/plaza-horde.jpg" alt="">
                <img class="hub-photo is-alliance" src="assets/hub/plaza-alliance.jpg" alt="">
                <img class="hub-photo" src="assets/hub/plaza.jpg" alt="" onerror="this.remove()">
              </span>
              <span class="hub-copy">
                <strong data-i18n="plazaTab"></strong>
                <span class="hub-desc" data-i18n="plazaDesc"></span>
                <span class="hub-go" data-i18n="plazaSoonBadge"></span>
              </span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <main id="helperView" class="hidden">
      <div class="layout">
        <section class="panel">
          <h2 data-i18n="specTitle"></h2>
          <div class="sub" data-i18n="specSub"></div>
          <div class="toolbar">
            <input id="search" class="search" data-i18n-placeholder="search">
            <button id="clear" class="ghost" data-i18n="clear"></button>
          </div>
          <div id="filters" class="role-filter"></div>
          <div id="specList" class="spec-list"></div>
        </section>

        <section class="panel">
          <div class="raid-head">
            <div>
              <h2 data-i18n="raidTitle"></h2>
              <div class="sub" data-i18n="raidSub"></div>
            </div>
            <div class="size">
              <span data-i18n="size"></span>
              <select id="raidSize">
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
              </select>
              <button id="aiRecBtn" class="primary" type="button" data-i18n="aiRecBtn"></button>
              <span class="rp-help-q ai-help-q" tabindex="0" data-i18n-label="aiHelp">
                <span aria-hidden="true">?</span>
                <span class="rp-help-tip" role="tooltip" data-i18n="aiHelp"></span>
              </span>
            </div>
          </div>
          <div class="meter"><i id="meter"></i></div>
          <div id="headcount" class="headcount"></div>
          <div id="planRaidBanner" class="plan-raid-banner hidden">
            <div class="plan-raid-copy">
              <b data-i18n="planRaidTitle"></b>
              <span data-i18n="planRaidSub"></span>
            </div>
            <button id="planRaidBtn" class="primary" type="button" data-i18n="planRaidBtn"></button>
          </div>
          <div id="columns" class="columns"></div>
          <div id="statusBox" class="ai-rec-box hidden"></div>
          <div class="counts" id="counts"></div>
        </section>

        <section class="panel" id="synPanel">
          <h2 data-i18n="synTitle"></h2>
          <div class="sub" data-i18n="synSub"></div>
          <div id="synCompleteBanner" class="syn-complete-banner hidden" aria-live="polite"></div>
          <div id="synergies"></div>
          <div class="tip" data-i18n="synTip"></div>
        </section>
      </div>
    </main>

    <main id="plannerView" class="hidden">
      <!-- RaidPlanner mounts here -->
    </main>

    <main id="gameView" class="hidden">
      <section class="coming-soon" id="gameSoon">
        <div class="coming-icon" aria-hidden="true">03</div>
        <h2 data-i18n="gameTab"></h2>
        <div class="coming-line"></div>
        <p class="sub" data-i18n="gameSoon"></p>
      </section>
    </main>

    <main id="communityView" class="hidden">
      <section class="coming-soon" id="communitySoon">
        <div class="coming-icon" aria-hidden="true">04</div>
        <h2 data-i18n="plazaTab"></h2>
        <div class="coming-line"></div>
        <p class="sub" data-i18n="plazaSoon"></p>
      </section>
    </main>

    <p class="site-contact">
      <span data-i18n="contactNote"></span>
      <a href="mailto:contact@raidcommandcenter.com">contact@raidcommandcenter.com</a>
    </p>
  </div>

  <div id="celebrateOverlay" class="celebrate-overlay hidden" aria-hidden="true">
    <div class="celebrate-burst" id="celebrateBurst"></div>
    <div class="celebrate-card">
      <div class="celebrate-icon">⚔</div>
      <div class="celebrate-title" id="celebrateTitle"></div>
      <div class="celebrate-sub" id="celebrateSub"></div>
    </div>
  </div>

  <script>
    var whTooltips = { colorLinks: true, iconizeLinks: false, renameLinks: false };
  </script>
  <script src="https://wow.zamimg.com/js/tooltips.js"></script>
  <script src="js/data.js"></script>
  <script src="js/game-balance.js"></script>
  <script src="js/game-engine.js"></script>
  <script src="js/game-fx.js"></script>
  <script src="js/game-arena.js"></script>
  <script src="js/game-ui.js"></script>
  <script src="js/planner-catalog.js"></script>
  <script src="js/wcl-client.js"></script>
  <script src="js/board-assets.js"></script>
  <script src="js/raid-store.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/community.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
